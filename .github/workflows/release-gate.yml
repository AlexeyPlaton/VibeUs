name: release-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-core
    env:
      ENVIRONMENT: test
      TESTING: "true"
      TOKEN_PEPPER: ci_only_token_pepper_please_replace_1234567890
      FIELD_ENCRYPTION_KEY: ci_only_field_key_please_replace_12345678901234567890
      ENABLE_DEMO_SEED: "false"
      ENABLE_MOCK_BILLING: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openspec-core/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openspec-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:all
      - name: Verify embedded-widget build handoff
        run: |
          test -s ../openspec-core/static/vibus-widget.umd.cjs
          test -s ../openspec-core/static/vibus-widget.css
          test -s ../openspec-core/static/widget-build-manifest.json
          node -e "const m=require('../openspec-core/static/widget-build-manifest.json'); if(!m.files?.['vibus-widget.umd.cjs']?.sha256) process.exit(1)"

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      TESTING: "true"
      DATABASE_URL: sqlite+aiosqlite:///./e2e.sqlite
      TOKEN_PEPPER: ci_only_token_pepper_please_replace_1234567890
      FIELD_ENCRYPTION_KEY: ci_only_field_key_please_replace_12345678901234567890
      ENABLE_DEMO_SEED: "false"
      ENABLE_MOCK_BILLING: "true"
      ENABLE_GLOBAL_PRICING: "true"
      GLOBAL_BILLING_PROVIDER: cloudpayments
      ENABLE_CLOUDPAYMENTS: "false"
      ENABLE_YOOKASSA: "false"
      PUBLIC_BASE_URL: http://localhost:5173
      PREVIEW_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173
      VITE_LEGAL_VERSION: e2e-v8
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openspec-core/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openspec-web/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r openspec-core/requirements.txt
      - name: Install frontend and Playwright
        working-directory: openspec-web
        run: |
          npm ci
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run build:all
      - name: Prepare E2E database
        working-directory: openspec-core
        run: alembic upgrade head
      - name: Start real API and Vite
        run: |
          (cd openspec-core && python -m uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/vibeus-api.log 2>&1 & echo $! > /tmp/vibeus-api.pid)
          (cd openspec-web && npm run dev -- --host 0.0.0.0 --port 5173 > /tmp/vibeus-web.log 2>&1 & echo $! > /tmp/vibeus-web.pid)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready >/dev/null && curl -fsS http://localhost:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "API log:" && cat /tmp/vibeus-api.log
          echo "Web log:" && cat /tmp/vibeus-web.log
          exit 1
      - name: Run browser release journeys
        working-directory: openspec-web
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: openspec-web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== API ===" && cat /tmp/vibeus-api.log || true
          echo "=== WEB ===" && cat /tmp/vibeus-web.log || true

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openspec-cli/package-lock.json
      - run: npm ci
      - run: npm test

  quality-gates:
    name: regression-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openspec-core/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r openspec-core/requirements.txt
      - name: Release integrity
        run: |
          python quality-gates/v4-release-integrity/verify_integrity.py
          python -m pytest -q quality-gates/v4-release-integrity/tests
      - name: Billing and entitlement ledger
        run: |
          python quality-gates/v5-billing-ledger-closure/verify_integrity.py
          python -m pytest -q quality-gates/v5-billing-ledger-closure/tests
      - name: Definition-of-Done criteria contract
        run: python quality-gates/v6-criteria-contract/verify_contract_v2.py .
      - name: Verification evidence closure
        run: |
          python quality-gates/v6.1-evidence-closure/verify_evidence_closure.py .
          node --test quality-gates/v6.1-evidence-closure/tests-js/evidence_closure.test.mjs
          python quality-gates/v6.1-evidence-closure/scripts/migration_smoke.py .
      - name: Trusted evidence binding
        run: |
          python quality-gates/v6.2-trusted-evidence/verify_trusted_evidence.py .
          node --test quality-gates/v6.2-trusted-evidence/tests-js/trusted_evidence.test.mjs
          python -m pytest -q quality-gates/v6.2-trusted-evidence/tests
      - name: English and Russian internationalization
        run: |
          python quality-gates/v7-i18n-global-launch/verify_i18n_global_launch.py .
          node --test quality-gates/v7-i18n-global-launch/tests-js/i18n_contract.test.mjs
