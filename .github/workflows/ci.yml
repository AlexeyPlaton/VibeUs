name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-core
    env:
      ENVIRONMENT: test
      TESTING: "true"
      TOKEN_PEPPER: ci_only_token_pepper_please_replace_1234567890
      FIELD_ENCRYPTION_KEY: ci_only_field_key_please_replace_12345678901234567890
      ENABLE_DEMO_SEED: "false"
      ENABLE_MOCK_BILLING: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openspec-core/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend native tests
        run: |
          python -m pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openspec-web/package-lock.json

      - name: Install and test frontend
        run: |
          npm ci
          npm test
          npm run build:all

  test-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openspec-cli
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openspec-cli/package-lock.json

      - name: Test CLI
        run: |
          npm ci
          npm run test

  release-gate:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      TESTING: "true"
      TOKEN_PEPPER: ci_only_token_pepper_please_replace_1234567890
      FIELD_ENCRYPTION_KEY: ci_only_field_key_please_replace_12345678901234567890
      ENABLE_DEMO_SEED: "false"
      ENABLE_MOCK_BILLING: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: openspec-core/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r openspec-core/requirements.txt
          cd openspec-web && npm ci && cd ../openspec-cli && npm ci && cd ..

      - name: Run Official 16-Section Release Gate
        run: |
          python run_release_gate.py
