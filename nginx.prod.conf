# Rate limiting zone: 30 requests/second per IP with burst
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 1. HTTP Server — Certbot Challenge & HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name vibus.pro www.vibus.pro *.vibus.pro;

    # Let's Encrypt ACME Challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibus.pro www.vibus.pro *.vibus.pro;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vibus.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibus.pro/privkey.pem;

    # SSL Hardening & Modern Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' wss: https:; frame-ancestors *;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max body size for file/bug context uploads
    client_max_body_size 25M;

    # Founder/admin control plane is intentionally not served on the public
    # customer origin. The private control deployment has its own gateway/origin.
    # Keep these explicit denies even though the public FastAPI and SPA builds no
    # longer mount control routes: defense in depth against accidental regression.
    location ^~ /api/control {
        return 404;
    }

    location ^~ /control {
        return 404;
    }

    # 1. Landing & Web App Static Files (SPA with client routing)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Static Widget Assets (Long cache)
    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 3. REST API with Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 4. WebSocket Duplex Streams (IDE Sync & Tunnel Multiplexing)
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. Live Preview Tunnel Reverse Proxy (No buffering for streaming)
    location /preview/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 6. Healthcheck endpoint
    location /health {
        proxy_pass http://api:8000;
        access_log off;
    }
}
