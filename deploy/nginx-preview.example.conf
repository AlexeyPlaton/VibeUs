# Illustrative reverse-proxy split. Adjust TLS paths/upstreams for your host.
# Security property: account/API and untrusted Live Preview use DIFFERENT
# registrable domains.

upstream vibeus_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name vibeus.pro;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 2m;

    location / {
        proxy_pass http://vibeus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl http2;
    server_name preview.vibeus-preview.net;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 2m;

    # Preview bootstrap/session exchange + tunnel HTTP proxy go to the same
    # backend. Preview cookies are host-only (no Domain attribute).
    location / {
        proxy_pass http://vibeus_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Never let intermediary caches retain preview traffic.
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
